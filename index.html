<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="복소수 게임" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>복소수 좌표 게임</title>
  <style>
    :root{--bg:#eaf2ff;--ink:#0f172a;--muted:#64748b;--card:#fff;--line:#e2e8f0;--dark:#0f172a;--accent:#2563eb;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body,#app{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f1f5f9,#dbeafe,#e2e8f0);overscroll-behavior:none} button,input{font:inherit} button{touch-action:manipulation;cursor:pointer;border:0} .wrap{max-width:1280px;margin:0 auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}.setup{max-width:860px;margin:0 auto;background:#fff;border-radius:32px;padding:24px;box-shadow:0 24px 60px #0f172a22}.hero{background:#0f172a;color:white;border-radius:28px;padding:24px}.hero h1{font-size:38px;margin:0 0 8px;font-weight:900}.hero p{margin:0;color:#cbd5e1;font-size:18px}.section{border:2px solid #e2e8f0;border-radius:26px;padding:18px;margin-top:16px}.title{font-size:21px;font-weight:900;margin-bottom:12px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{min-height:56px;border-radius:20px;background:#0f172a;color:white;font-weight:900;font-size:18px;padding:10px 14px}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.outline{background:#fff;color:#0f172a;border:2px solid #cbd5e1}.btn:disabled{opacity:.42;cursor:not-allowed}.input{width:100%;border:2px solid #cbd5e1;border-radius:20px;padding:14px 18px;font-size:28px;font-weight:900;outline:none}.playerCard{border:2px solid #e2e8f0;border-radius:26px;padding:18px}.nameRow{display:flex;gap:12px;align-items:center;margin-bottom:12px}.dot{width:26px;height:26px;border-radius:999px;display:inline-block;flex:0 0 auto}.nameInput{min-width:0;flex:1;border:2px solid #fff;border-radius:18px;padding:12px 14px;font-weight:900;font-size:20px;background:#ffffffcc}.colorBtn{border:4px solid #fff;border-radius:18px;padding:9px;font-weight:900}.colorBtn.sel{border-color:#0f172a;transform:scale(1.04)}.colorBtn:disabled{opacity:.33}.game{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0f172a;color:white;border-radius:30px;padding:16px;box-shadow:0 16px 40px #0f172a26}.topbar h1{margin:2px 0 0;font-size:31px}.sub{color:#cbd5e1;font-weight:800;font-size:14px}.boardCard{border:4px solid #0f172a;border-radius:32px;background:white;padding:12px;box-shadow:0 20px 50px #0f172a24}.boardHead{display:flex;justify-content:space-between;align-items:center;padding:0 8px 8px;font-weight:900;font-size:20px}.pill{background:#0f172a;color:white;border-radius:999px;padding:6px 12px;font-size:14px}.boardScroll{overflow:auto;background:#f8fafc;border-radius:24px;padding:8px}.board{display:block;margin:0 auto;background:white;border-radius:18px;touch-action:none;user-select:none}.panel{background:white;border:4px solid #0f172a;border-radius:32px;padding:18px;box-shadow:0 20px 50px #0f172a24}.current{border-radius:24px;padding:14px}.currentName{display:flex;align-items:center;gap:12px;font-size:36px;font-weight:900}.currentPos{font-weight:900;font-size:20px;margin-top:6px}.mini{background:#f1f5f9;border-radius:24px;padding:14px;text-align:center}.mini .lab{font-size:14px;color:#64748b;font-weight:900}.mini .val{font-size:30px;font-weight:900}.opVal{font-size:46px!important}.message{background:#0f172a;color:white;border-radius:24px;padding:16px;font-size:18px;line-height:1.45;font-weight:900}.diceArea{background:#f8fafc;border-radius:26px;padding:16px}.dieWrap{text-align:center}.dieLabel{font-size:14px;color:#64748b;font-weight:900;margin-bottom:7px}.die{width:94px;height:94px;margin:0 auto;display:grid;place-items:center;border:4px solid #cbd5e1;border-radius:24px;background:white;font-size:40px;font-weight:900;box-shadow:0 8px 22px #0f172a18}.rolling{animation:shake .65s ease-in-out}@keyframes shake{0%{transform:rotate(0) translateY(0)}20%{transform:rotate(18deg) translateY(-8px) scale(1.08)}40%{transform:rotate(-18deg) translateY(5px) scale(.96)}60%{transform:rotate(12deg) translateY(-4px) scale(1.05)}80%{transform:rotate(-12deg)}100%{transform:rotate(0)}}.resultBox{border:2px solid #e2e8f0;border-radius:24px;padding:14px;text-align:center}.resultBox .val{font-size:36px;font-weight:900}.statusCard{background:white;border:4px solid #0f172a;border-radius:32px;padding:18px;box-shadow:0 14px 34px #0f172a18}.statusLine{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:18px;padding:12px;margin-top:8px;font-weight:900}.smallNote{border-radius:18px;padding:12px;font-weight:800;font-size:14px}.amber{background:#fffbeb;color:#92400e}.rose{background:#fff1f2;color:#9f1239}.log{max-height:250px;overflow:auto;border:1px solid #e2e8f0;border-radius:16px}.log table{width:100%;border-collapse:collapse;font-size:13px}.log th{position:sticky;top:0;background:#f1f5f9}.log th,.log td{border-bottom:1px solid #e2e8f0;text-align:left;padding:8px}.win{background:#fef3c7;border-radius:24px;padding:16px;text-align:center;box-shadow:0 0 0 4px #facc15 inset}.winTitle{font-size:18px;font-weight:900;color:#92400e}.winName{font-size:36px;font-weight:900;margin-top:4px}.details{margin-top:12px;background:white;border-radius:20px;padding:12px;text-align:left}.details summary{text-align:center;font-size:18px;font-weight:900;cursor:pointer}.finalRow{display:flex;align-items:center;justify-content:space-between;border-radius:16px;background:#f8fafc;padding:12px;margin-top:8px;font-weight:900}.hidden{display:none!important}.correct{border-color:#22c55e!important}.wrong{border-color:#ef4444!important}.wrongMark{pointer-events:none}.safeBottom{height:env(safe-area-inset-bottom)}@media(max-width:980px){.game{grid-template-columns:1fr}.panel{order:-1}.topbar h1{font-size:26px}.currentName{font-size:30px}.setup{padding:16px}.grid5{grid-template-columns:repeat(5,1fr)}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
const DIE_VALUES=[-2,-1,0,1,2,3], OPS=['+','-','×'], LIMIT=20, SCALE=14;
const COLORS=[{name:'파랑',fill:'#2563eb',light:'#dbeafe'},{name:'빨강',fill:'#dc2626',light:'#fee2e2'},{name:'초록',fill:'#16a34a',light:'#dcfce7'},{name:'보라',fill:'#9333ea',light:'#f3e8ff'},{name:'주황',fill:'#ea580c',light:'#ffedd5'},{name:'분홍',fill:'#db2777',light:'#fce7f3'}];
let state={started:false,playerCount:2,rounds:4,players:[mkPlayer(1,0),mkPlayer(2,1)],mode:'random',current:0,turnCounts:[],candidate:null,pendingTurn:null,selectedOp:'+',randomOp:'+',opBag:[...OPS],history:[],message:'주사위를 굴린 뒤, 직접 계산하고 좌표평면에 정답 위치를 찍으세요.',target:{re:6,im:-4},rolling:false,dice:[null,null],wrong:null,feedback:null,advancing:false,gameOver:false,winner:null,phaseResults:{random:null,target:null},finalResult:null};
function mkPlayer(id,c){return{id,name:id+'번',color:COLORS[c%COLORS.length],position:{re:0,im:0}}}
function rollDie(){return DIE_VALUES[Math.floor(Math.random()*DIE_VALUES.length)]}
function fmt(z){let a=z.re,b=z.im;if(a===0&&b===0)return'0';if(b===0)return''+a;if(a===0)return b===1?'i':b===-1?'-i':b+'i';let sign=b>0?'+':'-',ab=Math.abs(b);return `${a} ${sign} ${ab===1?'i':ab+'i'}`}
function add(z,w){return{re:z.re+w.re,im:z.im+w.im}}function sub(z,w){return{re:z.re-w.re,im:z.im-w.im}}function mul(z,w){return{re:z.re*w.re-z.im*w.im,im:z.re*w.im+z.im*w.re}}function operate(z,w,op){return op==='+'?add(z,w):op==='-'?sub(z,w):mul(z,w)}function dist(z,t={re:0,im:0}){return Math.sqrt((z.re-t.re)**2+(z.im-t.im)**2)}function bounds(z){return Math.abs(z.re)<=LIMIT&&Math.abs(z.im)<=LIMIT}function same(a,b){return a.re===b.re&&a.im===b.im}function tone(type){try{let C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=type==='success'?720:170;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);o.start();o.stop(ctx.currentTime+.22)}catch(e){}}
function rank(players,mode){return players.map(p=>({...p,distance:mode==='target'?dist(p.position,state.target):dist(p.position)})).sort((a,b)=>mode==='target'?a.distance-b.distance:b.distance-a.distance).map((p,i)=>({...p,rank:i+1,point:players.length-i,score:p.distance}))}
function finalCalc(results){let r1=results.random||[],r2=results.target||[];let rows=state.players.map(p=>{let a=r1.find(x=>x.id===p.id),b=r2.find(x=>x.id===p.id),p1=a?.point||0,p2=b?.point||0;return{id:p.id,name:p.name,color:p.color,randomPoint:p1,targetPoint:p2,totalPoint:p1+p2*2}}).sort((a,b)=>b.totalPoint-a.totalPoint||b.targetPoint-a.targetPoint||b.randomPoint-a.randomPoint);return{rows,winner:rows[0]}}
function render(){const app=document.getElementById('app');app.innerHTML=state.started?gameHtml():setupHtml();bind();}
function setupHtml(){return `<div class="wrap"><div class="setup"><div class="hero"><h1>복소수 좌표 게임</h1><p>참가자와 말 색을 고른 뒤 게임을 시작하세요.</p></div><div class="section"><div class="title">참가 인원수</div><div class="grid5">${[1,2,3,4,5].map(n=>`<button class="btn ${state.playerCount===n?'':'outline'}" data-count="${n}">${n}명</button>`).join('')}</div></div><div class="section"><div class="title">각자 몇 번씩 할까요?</div><input id="roundInput" class="input" type="number" min="1" max="10" value="${state.rounds}"><p style="font-weight:800;color:#64748b">1차는 4턴 이상 추천. 3턴이면 곱셈 체감이 약할 수 있어요.</p></div><div class="grid2">${state.players.map((p,i)=>playerSetupHtml(p,i)).join('')}</div><button id="start" class="btn" style="width:100%;height:66px;border-radius:26px;font-size:24px;margin-top:16px">게임 시작</button></div></div>`}
function playerSetupHtml(p,i){return `<div class="playerCard" style="background:${p.color.light}"><div class="nameRow"><span class="dot" style="background:${p.color.fill}"></span><input class="nameInput" data-name="${i}" value="${p.name}" placeholder="${i+1}번 이름"></div><div class="grid3">${COLORS.map(c=>{let taken=state.players.some((pp,j)=>j!==i&&pp.color.name===c.name),sel=p.color.name===c.name;return `<button class="colorBtn ${sel?'sel':''}" data-color="${i}|${c.name}" ${taken?'disabled':''} style="background:${c.light}"><span class="dot" style="width:32px;height:32px;background:${c.fill};display:block;margin:0 auto 4px"></span>${c.name}${taken?'<br><small>선택됨</small>':''}</button>`}).join('')}</div></div>`}
function gameHtml(){let p=state.players[state.current], curScore=state.mode==='target'?dist(p.position,state.target):dist(p.position);return `<div class="wrap"><div class="game"><div><div class="topbar"><div><div class="sub">COMPLEX PLANE GAME</div><h1>복소수 좌표 게임</h1><div class="sub">각자 ${state.rounds}턴 · 완료 ${state.turnCounts.reduce((s,c)=>s+c,0)} / ${state.players.length*state.rounds}</div></div><div style="display:flex;gap:8px"><button class="btn ${state.mode==='random'?'secondary':'outline'}" id="modeRandom" ${state.candidate?'disabled':''}>1차: 멀리 가기</button><button class="btn ${state.mode==='target'?'secondary':'outline'}" id="modeTarget" ${state.candidate?'disabled':''}>2차: 목표점</button></div></div>${boardHtml()}</div><div><div class="panel ${state.feedback==='success'?'correct':state.feedback==='fail'?'wrong':''}"><div class="current" style="background:${p.color.light}"><div class="sub" style="color:#475569">현재 차례</div><div class="currentName"><span class="dot" style="width:36px;height:36px;background:${p.color.fill}"></span>${p.name}</div><div class="currentPos">현재 위치: (${p.position.re}, ${p.position.im})</div></div><div class="grid2" style="margin-top:12px"><div class="mini"><div class="lab">현재 위치</div><div class="val">(${p.position.re}, ${p.position.im})</div></div><div class="mini"><div class="lab">이번 연산</div><div class="val opVal">${state.candidate?state.pendingTurn?.op||state.randomOp:'-'}</div></div></div><div class="message" style="margin-top:12px">${state.message}</div>${winnerHtml()}<div class="diceArea grid2" style="margin-top:12px"><div class="dieWrap"><div class="dieLabel">실수부</div><div class="die ${state.rolling?'rolling':''}">${state.dice[0]??'?'}</div></div><div class="dieWrap"><div class="dieLabel">허수부</div><div class="die ${state.rolling?'rolling':''}">${state.dice[1]??'?'}</div></div></div><div class="resultBox" style="margin-top:12px"><div class="lab">나온 복소수</div><div class="val">${state.candidate?fmt(state.candidate):'-'}</div></div>${state.mode==='target'?opSelectHtml():''}<div class="grid2" style="margin-top:12px"><button id="roll" class="btn" ${state.rolling||state.candidate||state.advancing||state.gameOver?'disabled':''}>${state.advancing?'차례 전환':state.rolling?'굴리는 중':'주사위'}</button><button id="skip" class="btn secondary" ${state.rolling||state.candidate||state.advancing||state.gameOver?'disabled':''}>차례 넘기기</button></div><div class="grid2" style="margin-top:12px"><button id="reset" class="btn outline">새 판</button><button id="setup" class="btn outline">설정</button></div></div>${statusHtml()}${logHtml()}</div></div></div>`}
function winnerHtml(){if(!state.gameOver||!state.winner)return'';let w=state.winner;return `<div class="win" style="margin-top:12px"><div class="winTitle">${state.mode==='random'?'1차 결과':'2차 결과'}</div><div class="winName" style="color:${w.color.fill}">승자: ${w.name}</div><div style="font-weight:900;color:#92400e">${state.mode==='random'?`원점에서 거리 ${w.score.toFixed(2)}`:`목표점까지 거리 ${w.score.toFixed(2)}`}</div>${state.mode==='target'&&state.finalResult?.winner?`<details class="details"><summary>최종 승리자 확인하기</summary><div class="win" style="margin-top:12px;background:#f8fafc;box-shadow:none"><div class="winTitle" style="color:#475569">최종 우승</div><div class="winName" style="color:${state.finalResult.winner.color.fill}">${state.finalResult.winner.name}</div></div>${state.finalResult.rows.map(r=>`<div class="finalRow"><span><span class="dot" style="width:20px;height:20px;background:${r.color.fill};vertical-align:middle;margin-right:7px"></span>${r.name}</span><span>${r.randomPoint} + ${r.targetPoint}×2 = ${r.totalPoint}</span></div>`).join('')}</details>`:''}</div>`}
function opSelectHtml(){return `<div class="section" style="margin-top:12px"><div class="title">연산 선택</div><div class="grid3">${OPS.map(op=>`<button class="btn ${state.selectedOp===op?'':'outline'}" data-op="${op}" ${state.candidate?'disabled':''} style="height:64px;font-size:30px">${op}</button>`).join('')}</div></div>`}
function statusHtml(){return `<div class="statusCard" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:24px;font-weight:900">참가자 현황</h2>${state.mode==='target'?'<button id="target" class="btn outline" '+(state.candidate?'disabled':'')+'>목표 변경</button>':''}</div><div class="smallNote ${state.mode==='random'?'amber':'rose'}" style="margin-top:12px">${state.mode==='random'?'1차 게임: 원점에서 멀수록 유리합니다.':'2차 게임: 목표점 '+fmt(state.target)+' 에 가까울수록 유리합니다.'}</div>${state.players.map((p,i)=>`<div class="statusLine" style="background:${p.color.light};${i===state.current?'box-shadow:0 0 0 4px #0f172a inset':''}"><span><span class="dot" style="width:24px;height:24px;background:${p.color.fill};vertical-align:middle;margin-right:7px"></span>${p.name} · (${p.position.re}, ${p.position.im}) · ${state.turnCounts[i]||0}/${state.rounds}턴</span><span>${(state.mode==='target'?dist(p.position,state.target):dist(p.position)).toFixed(2)}</span></div>`).join('')}</div>`}
function logHtml(){return `<div class="statusCard" style="margin-top:14px;border-width:2px"><h2 style="margin:0 0 12px;font-size:20px;font-weight:900">계산 기록지</h2><div class="log"><table><thead><tr><th>턴</th><th>참가자</th><th>계산</th><th>선택</th><th>판정</th></tr></thead><tbody>${state.history.length?state.history.map(h=>`<tr><td>${h.turn}</td><td><span class="dot" style="width:12px;height:12px;background:${h.playerColor};vertical-align:middle;margin-right:4px"></span>${h.playerName}</td><td>${fmt(h.before)} ${h.op} (${fmt(h.number)})</td><td>${fmt(h.picked)}</td><td style="font-weight:900;color:${h.accepted?'#15803d':'#b91c1c'}">${h.accepted?'정답':h.reason}</td></tr>`).join(''):'<tr><td colspan="5" style="color:#64748b">아직 기록이 없습니다.</td></tr>'}</tbody></table></div></div>`}
function boardHtml(){let size=LIMIT*2*SCALE,center=size/2,toX=x=>center+x*SCALE,toY=y=>center-y*SCALE;let lines='',labels='';for(let i=-LIMIT;i<=LIMIT;i++){let strong=i===0||i%5===0,sw=i===0?2.4:strong?1:.55,cl=i===0?'#0f172a':strong?'#cbd5e1':'#f1f5f9';lines+=`<line x1="${toX(i)}" y1="0" x2="${toX(i)}" y2="${size}" stroke="${cl}" stroke-width="${sw}"/><line x1="0" y1="${toY(i)}" x2="${size}" y2="${toY(i)}" stroke="${cl}" stroke-width="${sw}"/>`;if(i%5===0&&i!==0){labels+=`<text x="${toX(i)-6}" y="${center+18}" fill="#64748b" font-size="11" font-weight="900">${i}</text><text x="${center+7}" y="${toY(i)+4}" fill="#64748b" font-size="11" font-weight="900">${i}</text>`}}
let hist=state.history.slice().reverse().map(h=>`<circle cx="${toX(h.after.re)}" cy="${toY(h.after.im)}" r="4" fill="${h.playerColor}" opacity=".32"/>`).join('');let target=state.mode==='target'?`<circle cx="${toX(state.target.re)}" cy="${toY(state.target.im)}" r="10" fill="#f43f5e"/><circle cx="${toX(state.target.re)}" cy="${toY(state.target.im)}" r="20" fill="#f43f5e" opacity=".16"/><text x="${toX(state.target.re)+14}" y="${toY(state.target.im)-14}" fill="#be123c" font-size="12" font-weight="900">목표 ${fmt(state.target)}</text>`:'';let wrong=state.wrong?`<g class="wrongMark"><circle cx="${toX(state.wrong.re)}" cy="${toY(state.wrong.im)}" r="15" fill="#ef4444" opacity=".25"/><line x1="${toX(state.wrong.re)-10}" y1="${toY(state.wrong.im)-10}" x2="${toX(state.wrong.re)+10}" y2="${toY(state.wrong.im)+10}" stroke="#dc2626" stroke-width="4"/><line x1="${toX(state.wrong.re)+10}" y1="${toY(state.wrong.im)-10}" x2="${toX(state.wrong.re)-10}" y2="${toY(state.wrong.im)+10}" stroke="#dc2626" stroke-width="4"/></g>`:'';let players=state.players.map((p,i)=>{let cur=i===state.current,off=state.players.length>1?(i-(state.players.length-1)/2)*5:0;return`<g transform="translate(${toX(p.position.re)+off},${toY(p.position.im)+off})"><circle r="${cur?24:18}" fill="${p.color.fill}" opacity=".12"/><circle r="${cur?13:10}" fill="${p.color.fill}" stroke="${cur?'#111827':'#fff'}" stroke-width="${cur?4:2}"/><text x="15" y="5" fill="${p.color.fill}" font-size="12" font-weight="900">${p.name}</text></g>`}).join('');return `<div class="boardCard"><div class="boardHead"><span>복소평면</span><span class="pill">범위 -20 ~ 20</span></div><div class="boardScroll"><svg id="board" class="board" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="white"/>${lines}${labels}<text x="${size-32}" y="${center-10}" fill="#334155" font-size="14" font-weight="900">Re</text><text x="${center+10}" y="20" fill="#334155" font-size="14" font-weight="900">Im</text>${hist}${target}${wrong}${players}</svg></div></div>`}
function bind(){document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{let n=+b.dataset.count;state.playerCount=n;state.players=Array.from({length:n},(_,i)=>state.players[i]||mkPlayer(i+1,i)).map((p,i)=>({...p,id:i+1,name:p.name||`${i+1}번`}));state.turnCounts=state.players.map(()=>0);render()});let ri=document.getElementById('roundInput');if(ri)ri.oninput=e=>state.rounds=Math.max(1,Math.min(10,Number(e.target.value)||1));document.querySelectorAll('[data-name]').forEach(inp=>inp.oninput=e=>{let i=+inp.dataset.name;state.players[i].name=e.target.value.trimStart()||`${i+1}번`});document.querySelectorAll('[data-color]').forEach(btn=>btn.onclick=()=>{let [i,name]=btn.dataset.color.split('|');i=+i;let c=COLORS.find(x=>x.name===name);if(state.players.some((p,j)=>j!==i&&p.color.name===name))return;state.players[i].color=c;render()});let start=document.getElementById('start');if(start)start.onclick=()=>startGame();let roll=document.getElementById('roll');if(roll)roll.onclick=rollFn;let skip=document.getElementById('skip');if(skip)skip.onclick=()=>nextTurn();let reset=document.getElementById('reset');if(reset)reset.onclick=resetGame;let setup=document.getElementById('setup');if(setup)setup.onclick=()=>{state.started=false;state.candidate=null;state.pendingTurn=null;render()};let mr=document.getElementById('modeRandom');if(mr)mr.onclick=()=>{if(state.candidate||state.rolling||state.advancing)return;state.mode='random';render()};let mt=document.getElementById('modeTarget');if(mt)mt.onclick=()=>startTarget();document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{state.selectedOp=b.dataset.op;render()});let target=document.getElementById('target');if(target)target.onclick=()=>{state.target={re:rollDie()*3,im:rollDie()*3};render()};let board=document.getElementById('board');if(board)board.addEventListener('pointerdown',pickPoint)}
function startGame(){state.players=state.players.map(p=>({...p,position:{re:0,im:0}}));state.history=[];state.candidate=null;state.pendingTurn=null;state.dice=[null,null];state.current=0;state.turnCounts=state.players.map(()=>0);state.gameOver=false;state.winner=null;state.phaseResults={random:null,target:null};state.finalResult=null;state.opBag=[...OPS];state.advancing=false;state.started=true;state.message=`${state.players[0].name} 차례입니다. 주사위를 굴리세요.`;render()}
function startTarget(){if(state.candidate||state.rolling||state.advancing)return;state.mode='target';state.players=state.players.map(p=>({...p,position:{re:0,im:0}}));state.current=0;state.turnCounts=state.players.map(()=>0);state.history=[];state.candidate=null;state.pendingTurn=null;state.dice=[null,null];state.wrong=null;state.feedback=null;state.gameOver=false;state.winner=null;state.phaseResults={...state.phaseResults,target:null};state.finalResult=null;state.message=`2차 게임 시작! 모든 말을 원점으로 되돌렸습니다. ${state.players[0].name} 차례입니다. 주사위를 굴리세요.`;render()}
function resetGame(){state.players=state.players.map(p=>({...p,position:{re:0,im:0}}));state.current=0;state.turnCounts=state.players.map(()=>0);state.candidate=null;state.pendingTurn=null;state.history=[];state.dice=[null,null];state.wrong=null;state.feedback=null;state.gameOver=false;state.winner=null;state.opBag=[...OPS];state.message='새 게임을 시작합니다. 1번 차례입니다. 주사위를 굴리세요.';render()}
function drawOp(){let bag=state.opBag.length?state.opBag:[...OPS];let i=Math.floor(Math.random()*bag.length),picked=bag[i];state.opBag=bag.filter((_,idx)=>idx!==i);return picked}
function rollFn(){if(state.rolling||state.candidate||state.advancing||state.gameOver)return;state.feedback=null;state.wrong=null;state.rolling=true;let ticks=0;let int=setInterval(()=>{state.dice=[rollDie(),rollDie()];render();ticks++;if(ticks>=10){clearInterval(int);let next={re:rollDie(),im:rollDie()},op=drawOp(),p=state.players[state.current],fixedOp=state.mode==='random'?op:state.selectedOp;state.dice=[next.re,next.im];state.candidate=next;state.pendingTurn={playerIndex:state.current,playerName:p.name,playerColor:p.color.fill,before:{...p.position},number:next,op:fixedOp};state.randomOp=op;state.rolling=false;state.message=`${p.name}: ${fmt(p.position)} ${fixedOp} (${fmt(next)}) 를 계산하고 도착점을 찍으세요.`;render()}},65)}
function completeTurn(i,finalPlayers,delay=900){state.turnCounts=state.turnCounts.map((c,idx)=>idx===i?c+1:c);moveNext(i,delay,state.turnCounts,finalPlayers)}
function moveNext(from,delay=750,counts=state.turnCounts,players=state.players){state.advancing=true;render();setTimeout(()=>{if(counts.every(c=>c>=state.rounds)){finish(players);return}let n=(from+1)%players.length,g=0;while(counts[n]>=state.rounds&&g<players.length){n=(n+1)%players.length;g++}state.current=n;state.candidate=null;state.pendingTurn=null;state.dice=[null,null];state.feedback=null;state.wrong=null;state.advancing=false;state.message=`${players[n].name} 차례입니다. 주사위를 굴리세요.`;render()},delay)}
function nextTurn(){if(state.rolling||state.candidate||state.advancing||state.gameOver)return;moveNext(state.current,0)}
function finish(players){let ranking=rank(players,state.mode),w=ranking[0],nextResults={...state.phaseResults,[state.mode]:ranking};state.winner=w;state.phaseResults=nextResults;state.finalResult=state.mode==='target'?finalCalc(nextResults):null;state.gameOver=true;state.candidate=null;state.pendingTurn=null;state.advancing=false;state.message=state.mode==='target'?'2차 게임 종료! 2차 승자를 확인하세요.':'1차 게임 종료! 1차 승자는 '+w.name+' 입니다. 2차 게임으로 넘어가세요.';render()}
function pickPoint(e){let turn=state.pendingTurn;if(!turn){state.message='먼저 주사위를 굴리세요.';render();return}let svg=e.currentTarget,rect=svg.getBoundingClientRect(),size=LIMIT*2*SCALE,center=size/2;let x=((e.clientX-rect.left)/rect.width)*size,y=((e.clientY-rect.top)/rect.height)*size;let picked={re:Math.round((x-center)/SCALE),im:Math.round((center-y)/SCALE)};if(Math.abs(picked.re)>LIMIT||Math.abs(picked.im)>LIMIT)return;let expected=operate(turn.before,turn.number,turn.op);if(!bounds(expected)){record(turn,picked,expected,false,'범위 밖');state.candidate=null;state.pendingTurn=null;state.wrong=picked;state.feedback='fail';tone('fail');state.message=`정답은 ${fmt(expected)} 이지만 게임판 범위 밖입니다. 이번 턴은 이동하지 않습니다.`;completeTurn(turn.playerIndex,state.players,950);return}if(same(picked,expected)){record(turn,picked,expected,true,'정답');state.players=state.players.map((p,i)=>i===turn.playerIndex?{...p,position:expected}:p);state.candidate=null;state.pendingTurn=null;state.feedback='success';tone('success');state.message=`정답! ${turn.playerName} 말이 ${fmt(expected)} 에 안착했습니다.`;completeTurn(turn.playerIndex,state.players,900)}else{state.wrong=picked;state.feedback='fail';tone('fail');state.message=`삑! ${fmt(picked)} 은/는 정답 위치가 아닙니다. 다시 계산해 보세요.`;render();setTimeout(()=>{state.wrong=null;render()},850)}}
function record(turn,picked,expected,accepted,reason){state.history=[{turn:state.history.length+1,before:turn.before,number:turn.number,op:turn.op,picked,expected,after:accepted?expected:turn.before,playerName:turn.playerName,playerColor:turn.playerColor,accepted,reason},...state.history]}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}render();
</script>
