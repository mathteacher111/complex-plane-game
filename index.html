<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>복소수 좌표 게임</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#eef2ff,#dbeafe);color:#0f172a}button,input{font:inherit}.wrap{max-width:1200px;margin:0 auto;padding:14px}.hidden{display:none!important}.card{background:white;border:3px solid #0f172a;border-radius:26px;box-shadow:0 10px 26px #0002;padding:16px}.hero{background:#0f172a;color:white;border-radius:26px;padding:20px;margin-bottom:14px}.hero h1{margin:0;font-size:34px}.btn{border:0;border-radius:18px;background:#0f172a;color:white;font-weight:900;padding:13px 16px;cursor:pointer}.btn.out{background:white;color:#0f172a;border:2px solid #cbd5e1}.btn.sec{background:#e2e8f0;color:#0f172a}.btn:disabled{opacity:.4}.grid{display:grid;gap:14px}.game{grid-template-columns:minmax(560px,1fr) 390px}@media(max-width:980px){.game{grid-template-columns:1fr}}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.boardBox{background:white;border:4px solid #0f172a;border-radius:28px;padding:12px;box-shadow:0 12px 28px #0002}.boardHead{display:flex;justify-content:space-between;font-weight:900;font-size:20px;margin:0 8px 8px}.badge{background:#0f172a;color:white;border-radius:999px;padding:5px 12px;font-size:14px}.scroll{overflow:auto;background:#f8fafc;border-radius:22px;padding:8px}svg{display:block;margin:auto;background:white;border-radius:18px;touch-action:none}.panel .box{background:#f8fafc;border-radius:22px;padding:13px;margin-bottom:12px}.msg{background:#0f172a;color:white;border-radius:22px;padding:14px;font-weight:900;line-height:1.45;margin-bottom:12px}.dice{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#f8fafc;border-radius:22px;padding:12px;margin-bottom:12px}.die{height:90px;width:90px;margin:auto;border:4px solid #cbd5e1;border-radius:22px;display:grid;place-items:center;background:white;font-size:38px;font-weight:1000}.roll{animation:shake .65s}@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(16deg) translateY(-8px)}50%{transform:rotate(-16deg) translateY(5px)}75%{transform:rotate(8deg)}100%{transform:rotate(0)}}.dot{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:8px}.players{display:grid;gap:8px}.prow{display:flex;justify-content:space-between;align-items:center;border-radius:16px;padding:10px;font-weight:900}.cur{outline:4px solid #0f172a}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.colorBtn{border:4px solid white;border-radius:16px;padding:9px;font-weight:900}.sel{border-color:#0f172a!important}.colorBtn:disabled{opacity:.35}.name{width:100%;border:2px solid #cbd5e1;border-radius:16px;padding:11px;font-size:19px;font-weight:900}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #e2e8f0;text-align:left}.result{background:#fef3c7;border:4px solid #facc15;border-radius:22px;text-align:center;font-weight:900;padding:14px;margin-bottom:12px}summary{cursor:pointer;font-size:19px;font-weight:1000;text-align:center}details{background:white;border-radius:16px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<section id="setup">
  <div class="hero"><h1>복소수 좌표 게임</h1><p>참가자, 말 색, 턴 수를 정하세요.</p></div>
  <div class="card">
    <h2>참가 인원수</h2><div id="countBtns" class="row"></div>
    <h2>각자 몇 번씩 할까요?</h2><input id="rounds" class="name" type="number" min="1" max="10" value="4"><p><b>추천:</b> 1차는 4~5턴이면 곱셈을 체감하기 좋습니다.</p>
    <h2>참가자 설정</h2><div id="settings"></div>
    <button class="btn" style="width:100%;height:62px;font-size:22px" onclick="start()">게임 시작</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="grid game">
    <div>
      <div class="hero row" style="justify-content:space-between">
        <div><h1>복소수 좌표 게임</h1><p id="progress"></p></div>
        <div class="row"><button id="bRandom" class="btn sec" onclick="setModeGame('random')">1차: 멀리 가기</button><button id="bTarget" class="btn out" onclick="setModeGame('target')">2차: 목표점</button></div>
      </div>
      <div class="boardBox"><div class="boardHead"><span>복소평면</span><span class="badge">-20 ~ 20</span></div><div class="scroll"><svg id="board" width="560" height="560" viewBox="0 0 560 560"></svg></div></div>
    </div>
    <div>
      <div class="card panel">
        <div id="turn" class="box"></div>
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr"><div class="box" style="text-align:center"><b>현재 위치</b><div id="pos" style="font-size:28px;font-weight:1000"></div></div><div class="box" style="text-align:center"><b>이번 연산</b><div id="op" style="font-size:46px;font-weight:1000">-</div></div></div>
        <div id="msg" class="msg">주사위를 굴리세요.</div>
        <div id="result"></div>
        <div class="dice"><div style="text-align:center;font-weight:900">실수부<div id="d1" class="die">?</div></div><div style="text-align:center;font-weight:900">허수부<div id="d2" class="die">?</div></div></div>
        <div class="box" style="text-align:center;border:2px solid #cbd5e1"><b>나온 복소수</b><div id="num" style="font-size:32px;font-weight:1000">-</div></div>
        <div id="choose" class="box hidden"><b>연산 선택</b><div class="row" style="display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px"><button class="btn" onclick="selected='+';draw()">+</button><button class="btn out" onclick="selected='-';draw()">-</button><button class="btn out" onclick="selected='×';draw()">×</button></div></div>
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr"><button id="roll" class="btn" style="height:60px;font-size:21px" onclick="rollDice()">주사위</button><button id="skip" class="btn sec" style="height:60px;font-size:21px" onclick="manualNext()">차례 넘기기</button></div>
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr;margin-top:10px"><button class="btn out" onclick="resetPhase()">새 판</button><button class="btn out" onclick="back()">설정</button></div>
      </div>
      <div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><h2>참가자 현황</h2><button id="targetBtn" class="btn out hidden" onclick="newTarget()">목표 변경</button></div><div id="help"></div><div id="plist" class="players"></div></div>
      <div class="card" style="margin-top:14px"><h2>계산 기록지</h2><div style="max-height:240px;overflow:auto"><table><thead><tr><th>턴</th><th>참가자</th><th>계산</th><th>선택</th><th>판정</th></tr></thead><tbody id="hist"><tr><td colspan="5">아직 기록이 없습니다.</td></tr></tbody></table></div></div>
    </div>
  </div>
</section>
</div>

<script>
const V=[-2,-1,0,1,2,3], OPS=["+","-","×"], L=20,S=14,N=560,C=280;
const COLORS=[["파랑","#2563eb","#dbeafe"],["빨강","#dc2626","#fee2e2"],["초록","#16a34a","#dcfce7"],["보라","#9333ea","#f3e8ff"],["주황","#ea580c","#ffedd5"],["분홍","#db2777","#fce7f3"]].map(x=>({name:x[0],fill:x[1],light:x[2]}));
let pc=2, rounds=4, players=[mkP(1,0),mkP(2,1)], cur=0, mode="random", selected="+", bag=[...OPS], cand=null, turn=null, target={re:6,im:-4}, hist=[], counts=[], phase={random:null,target:null}, final=null, over=false, rolling=false, advancing=false, wrong=null;
function mkP(id,c){return{id,name:id+"번",color:COLORS[c],pos:{re:0,im:0}}}
function q(id){return document.getElementById(id)}
function die(){return V[Math.floor(Math.random()*V.length)]}
function fc(z){let a=z.re,b=z.im;if(a==0&&b==0)return"0";if(b==0)return""+a;if(a==0)return b==1?"i":b==-1?"-i":b+"i";let s=b>0?"+":"-",ab=Math.abs(b);return a+" "+s+" "+(ab==1?"i":ab+"i")}
function add(a,b){return{re:a.re+b.re,im:a.im+b.im}}function sub(a,b){return{re:a.re-b.re,im:a.im-b.im}}function mul(a,b){return{re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}}function op(a,b,o){return o=="+"?add(a,b):o=="-"?sub(a,b):mul(a,b)}
function dist(z,t={re:0,im:0}){return Math.sqrt((z.re-t.re)**2+(z.im-t.im)**2)}function ok(z){return Math.abs(z.re)<=L&&Math.abs(z.im)<=L}function sx(x){return C+x*S}function sy(y){return C-y*S}
function setup(){q("countBtns").innerHTML="";[1,2,3,4,5].forEach(n=>{let b=document.createElement("button");b.className="btn "+(pc==n?"":"out");b.textContent=n+"명";b.onclick=()=>{pc=n;players=Array.from({length:n},(_,i)=>players[i]||mkP(i+1,i));setup()};q("countBtns").appendChild(b)});let s=q("settings");s.innerHTML="";players.forEach((p,i)=>{let d=document.createElement("div");d.className="card";d.style.margin="10px 0";d.style.background=p.color.light;d.innerHTML='<div class="row"><span class="dot" style="background:'+p.color.fill+'"></span><input class="name" value="'+p.name+'"></div><div class="colors"></div>';d.querySelector("input").oninput=e=>p.name=e.target.value||((i+1)+"번");let cb=d.querySelector(".colors");COLORS.forEach(c=>{let taken=players.some((pp,j)=>j!=i&&pp.color.name==c.name);let bt=document.createElement("button");bt.className="colorBtn "+(p.color.name==c.name?"sel":"");bt.disabled=taken;bt.style.background=c.light;bt.innerHTML='<span class="dot" style="background:'+c.fill+';display:block;margin:0 auto 4px"></span>'+c.name+(taken?"<br><small>선택됨</small>":"");bt.onclick=()=>{p.color=c;setup()};cb.appendChild(bt)});s.appendChild(d)})}
function start(){rounds=Math.max(1,+q("rounds").value||4);players=players.map(p=>({...p,pos:{re:0,im:0}}));cur=0;mode="random";counts=players.map(_=>0);hist=[];bag=[...OPS];cand=null;turn=null;over=false;final=null;phase={random:null,target:null};q("setup").classList.add("hidden");q("game").classList.remove("hidden");msg(players[0].name+" 차례입니다. 주사위를 굴리세요.");draw()}
function back(){q("game").classList.add("hidden");q("setup").classList.remove("hidden");setup()}
function setModeGame(m){if(cand||rolling||advancing)return;mode=m;if(m=="target"){players=players.map(p=>({...p,pos:{re:0,im:0}}));cur=0;counts=players.map(_=>0);hist=[];cand=null;turn=null;over=false;final=null;msg("2차 게임 시작! 모두 원점에서 시작합니다. "+players[0].name+" 차례입니다.")}draw()}
function drawOp(){let b=bag.length?bag:[...OPS],i=Math.floor(Math.random()*b.length),o=b[i];bag=b.filter((_,j)=>j!=i);return o}
function rollDice(){if(rolling||cand||advancing||over)return;rolling=true;wrong=null;draw();let t=0,id=setInterval(()=>{q("d1").textContent=die();q("d2").textContent=die();q("d1").classList.add("roll");q("d2").classList.add("roll");t++;if(t>=10){clearInterval(id);let n={re:die(),im:die()},ro=drawOp(),fo=mode=="random"?ro:selected;cand=n;turn={idx:cur,name:players[cur].name,color:players[cur].color.fill,before:{...players[cur].pos},num:n,op:fo};rolling=false;msg(turn.name+": "+fc(turn.before)+" "+fo+" ("+fc(n)+") 를 계산하고 도착점을 찍으세요.");draw()}},65)}
function boardClick(e){if(!turn){msg("먼저 주사위를 굴리세요.");return}let r=e.currentTarget.getBoundingClientRect(),x=((e.clientX-r.left)/r.width)*N,y=((e.clientY-r.top)/r.height)*N,p={re:Math.round((x-C)/S),im:Math.round((C-y)/S)};if(!ok(p))return;let ans=op(turn.before,turn.num,turn.op);if(!ok(ans)){record(p,ans,false,"범위 밖");cand=null;turn=null;wrong=p;msg("정답은 "+fc(ans)+" 이지만 범위 밖입니다.");complete(cur,players,900);return}if(p.re==ans.re&&p.im==ans.im){record(p,ans,true,"정답");let idx=turn.idx;players=players.map((pl,i)=>i==idx?{...pl,pos:ans}:pl);cand=null;turn=null;msg("정답! "+players[idx].name+" 말이 ("+ans.re+", "+ans.im+")에 안착했습니다.");draw();complete(idx,players,900)}else{wrong=p;msg("삑! ("+p.re+", "+p.im+") 은/는 정답 위치가 아닙니다. 다시 계산하세요.");draw();setTimeout(()=>{wrong=null;drawBoard()},850)}}
function record(p,a,acc,reason){hist.unshift({t:hist.length+1,name:turn.name,color:turn.color,before:turn.before,num:turn.num,op:turn.op,pick:p,after:acc?a:turn.before,acc,reason})}
function complete(i,fp,delay){counts=counts.map((c,j)=>j==i?c+1:c);next(i,delay,fp)}
function next(from,delay,fp=players){advancing=true;draw();setTimeout(()=>{if(counts.every(c=>c>=rounds)){finish(fp);return}let n=(from+1)%players.length,g=0;while(counts[n]>=rounds&&g<players.length){n=(n+1)%players.length;g++}cur=n;cand=null;turn=null;advancing=false;wrong=null;msg(players[cur].name+" 차례입니다. 주사위를 굴리세요.");draw()},delay)}
function manualNext(){if(rolling||cand||advancing||over)return;next(cur,0)}
function resetPhase(){players=players.map(p=>({...p,pos:{re:0,im:0}}));cur=0;counts=players.map(_=>0);hist=[];cand=null;turn=null;over=false;wrong=null;bag=[...OPS];msg("새 판입니다. "+players[0].name+" 차례입니다.");draw()}
function newTarget(){target={re:die()*3,im:die()*3};draw()}
function rank(fp,m){return fp.map(p=>({id:p.id,name:p.name,color:p.color,pos:p.pos,d:m=="target"?dist(p.pos,target):dist(p.pos)})).sort((a,b)=>m=="target"?a.d-b.d:b.d-a.d).map((p,i)=>({...p,point:fp.length-i}))}
function finish(fp){let r=rank(fp,mode),w=r[0];phase[mode]=r;over=true;advancing=false;if(mode=="target"){let rows=players.map(p=>{let a=(phase.random||[]).find(x=>x.id==p.id),b=(phase.target||[]).find(x=>x.id==p.id),p1=a?.point||0,p2=b?.point||0;return{id:p.id,name:p.name,color:p.color,random:p1,target:p2,total:p1+p2*2}}).sort((a,b)=>b.total-a.total||b.target-a.target);final={rows,winner:rows[0]};msg("2차 게임 종료! 2차 승자는 "+w.name+" 입니다.")}else msg("1차 게임 종료! 1차 승자는 "+w.name+" 입니다. 2차 게임으로 넘어가세요.");draw()}
function msg(t){q("msg").textContent=t}
function draw(){let p=players[cur];q("progress").textContent="각자 "+rounds+"턴 · 완료 "+counts.reduce((a,b)=>a+b,0)+" / "+(players.length*rounds);q("bRandom").className="btn "+(mode=="random"?"sec":"out");q("bTarget").className="btn "+(mode=="target"?"sec":"out");q("choose").classList.toggle("hidden",mode!="target");q("targetBtn").classList.toggle("hidden",mode!="target");q("turn").style.background=p.color.light;q("turn").innerHTML='<b>현재 차례</b><div style="font-size:32px;font-weight:1000"><span class="dot" style="background:'+p.color.fill+'"></span>'+p.name+'</div><div style="font-size:19px;font-weight:900">현재 위치: ('+p.pos.re+', '+p.pos.im+')</div>';q("pos").textContent="("+p.pos.re+", "+p.pos.im+")";q("op").textContent=cand?turn.op:"-";q("num").textContent=cand?fc(cand):"-";q("d1").textContent=cand?cand.re:"?";q("d2").textContent=cand?cand.im:"?";q("roll").disabled=rolling||cand||advancing||over;q("skip").disabled=rolling||cand||advancing||over;q("roll").textContent=advancing?"차례 전환":rolling?"굴리는 중":"주사위";q("help").innerHTML=mode=="random"?'<div class="box" style="background:#fffbeb;font-weight:900">1차: 원점에서 멀수록 유리합니다.</div>':'<div class="box" style="background:#fff1f2;font-weight:900">2차: 목표점 '+fc(target)+'에 가까울수록 유리합니다.</div>';drawResult();drawPlayers();drawHist();drawBoard()}
function drawResult(){let box=q("result");box.innerHTML="";if(!over)return;let r=rank(players,mode),w=r[0];let h='<div class="result"><div>'+(mode=="random"?"1차 결과":"2차 결과")+'</div><div style="font-size:32px;color:'+w.color.fill+'">승자: '+w.name+'</div><div>'+(mode=="random"?"원점에서 거리 ":"목표점까지 거리 ")+w.d.toFixed(2)+'</div>';if(mode=="target"&&final){h+='<details><summary>최종 승리자 확인하기</summary><div style="font-size:32px;text-align:center;font-weight:1000;color:'+final.winner.color.fill+'">'+final.winner.name+'</div>';final.rows.forEach(r=>h+='<div class="prow"><span><span class="dot" style="background:'+r.color.fill+'"></span>'+r.name+'</span><span>'+r.random+' + '+r.target+'×2 = '+r.total+'</span></div>');h+='</details>'}box.innerHTML=h+'</div>'}
function drawPlayers(){q("plist").innerHTML=players.map((p,i)=>'<div class="prow '+(i==cur?'cur':'')+'" style="background:'+p.color.light+'"><span><span class="dot" style="background:'+p.color.fill+'"></span>'+p.name+' · ('+p.pos.re+', '+p.pos.im+') · '+(counts[i]||0)+'/'+rounds+'턴</span><b>'+(mode=="target"?dist(p.pos,target):dist(p.pos)).toFixed(2)+'</b></div>').join("")}
function drawHist(){q("hist").innerHTML=hist.length?hist.map(h=>'<tr><td>'+h.t+'</td><td><span class="dot" style="width:12px;height:12px;background:'+h.color+'"></span>'+h.name+'</td><td>'+fc(h.before)+' '+h.op+' ('+fc(h.num)+')</td><td>('+h.pick.re+', '+h.pick.im+')</td><td style="font-weight:900;color:'+(h.acc?'#15803d':'#b91c1c')+'">'+(h.acc?'정답':h.reason)+'</td></tr>').join(""):'<tr><td colspan="5">아직 기록이 없습니다.</td></tr>'}
function drawBoard(){let svg=q("board");svg.innerHTML="";let ns="http://www.w3.org/2000/svg";function el(n,a,t){let e=document.createElementNS(ns,n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(t)e.textContent=t;svg.appendChild(e)}for(let i=-L;i<=L;i++){let st=i==0||i%5==0;el("line",{x1:sx(i),y1:0,x2:sx(i),y2:N,stroke:i==0?"#0f172a":st?"#cbd5e1":"#f1f5f9","stroke-width":i==0?2.4:st?1:.55});el("line",{x1:0,y1:sy(i),x2:N,y2:sy(i),stroke:i==0?"#0f172a":st?"#cbd5e1":"#f1f5f9","stroke-width":i==0?2.4:st?1:.55})}for(let i=-20;i<=20;i+=5)if(i){el("text",{x:sx(i)-6,y:C+18,fill:"#64748b","font-size":11,"font-weight":800},i);el("text",{x:C+7,y:sy(i)+4,fill:"#64748b","font-size":11,"font-weight":800},i)}hist.slice().reverse().forEach(h=>el("circle",{cx:sx(h.after.re),cy:sy(h.after.im),r:4,fill:h.color,opacity:.32}));if(mode=="target"){el("circle",{cx:sx(target.re),cy:sy(target.im),r:20,fill:"#f43f5e",opacity:.16});el("circle",{cx:sx(target.re),cy:sy(target.im),r:10,fill:"#f43f5e"});el("text",{x:sx(target.re)+14,y:sy(target.im)-14,fill:"#be123c","font-size":12,"font-weight":900},"목표 "+fc(target))}if(wrong){el("circle",{cx:sx(wrong.re),cy:sy(wrong.im),r:15,fill:"#ef4444",opacity:.25});el("line",{x1:sx(wrong.re)-10,y1:sy(wrong.im)-10,x2:sx(wrong.re)+10,y2:sy(wrong.im)+10,stroke:"#dc2626","stroke-width":4});el("line",{x1:sx(wrong.re)+10,y1:sy(wrong.im)-10,x2:sx(wrong.re)-10,y2:sy(wrong.im)+10,stroke:"#dc2626","stroke-width":4})}players.forEach((p,i)=>{let off=players.length>1?(i-(players.length-1)/2)*5:0,x=sx(p.pos.re)+off,y=sy(p.pos.im)+off,c=i==cur;el("circle",{cx:x,cy:y,r:c?24:18,fill:p.color.fill,opacity:.12});el("circle",{cx:x,cy:y,r:c?13:10,fill:p.color.fill,stroke:c?"#0f172a":"white","stroke-width":c?4:2});el("text",{x:x+15,y:y+5,fill:p.color.fill,"font-size":12,"font-weight":900},p.name)})}
q("board").addEventListener("pointerdown",boardClick);setup();
</script>
</body>
</html>
