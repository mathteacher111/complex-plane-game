<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>복소수 좌표 게임</title><style>
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:linear-gradient(135deg,#eef2ff,#dbeafe);color:#0f172a}button,input{font:inherit} .wrap{max-width:1200px;margin:auto;padding:14px}.card{background:white;border:3px solid #0f172a;border-radius:26px;padding:16px;box-shadow:0 10px 24px #0002}.title{background:#0f172a;color:white;border-radius:26px;padding:20px;margin-bottom:14px}.title h1{margin:0;font-size:32px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:18px;padding:13px 18px;background:#0f172a;color:white;font-weight:900}.btn.out{background:white;color:#0f172a;border:2px solid #cbd5e1}.btn.sec{background:#e2e8f0;color:#0f172a}.btn:disabled{opacity:.4}.grid{display:grid;grid-template-columns:minmax(560px,1fr) 390px;gap:14px}@media(max-width:980px){.grid{grid-template-columns:1fr}}.setup-player{border:2px solid #cbd5e1;border-radius:22px;padding:12px;margin:10px 0}.dot{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:8px;vertical-align:middle}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.color{border:4px solid white;border-radius:16px;padding:9px;font-weight:900}.color.sel{border-color:#0f172a}.color:disabled{opacity:.3}.name{width:100%;border:2px solid #cbd5e1;border-radius:16px;padding:12px;font-weight:900;font-size:20px}.boardbox{background:white;border:4px solid #0f172a;border-radius:28px;padding:10px;box-shadow:0 10px 24px #0002}.boardhead{display:flex;justify-content:space-between;font-weight:1000;font-size:20px;margin:0 8px 8px}.badge{background:#0f172a;color:white;border-radius:999px;padding:5px 10px;font-size:14px}.scroll{overflow:auto;background:#f8fafc;border-radius:20px;padding:8px}svg{display:block;margin:auto;background:white;border-radius:16px;touch-action:none}.panel .sec{border-radius:22px;padding:12px;margin-bottom:10px;background:#f8fafc}.msg{background:#0f172a;color:white;border-radius:20px;padding:13px;font-weight:900;line-height:1.45}.dice{height:88px;width:88px;margin:auto;border:4px solid #cbd5e1;border-radius:24px;display:grid;place-items:center;background:white;font-size:38px;font-weight:1000}.dice.roll{animation:shake .65s}@keyframes shake{20%{transform:rotate(15deg) translateY(-8px)}40%{transform:rotate(-15deg) translateY(5px)}60%{transform:rotate(10deg) translateY(-4px)}}.players{display:grid;gap:8px}.prow{display:flex;justify-content:space-between;align-items:center;border-radius:16px;padding:10px;font-weight:900}.cur{outline:4px solid #0f172a}.result{background:#fef3c7;border:4px solid #facc15;border-radius:22px;padding:14px;text-align:center;font-weight:1000;margin:10px 0}details{background:white;border-radius:16px;padding:10px;margin-top:10px}summary{text-align:center;cursor:pointer;font-size:18px;font-weight:1000}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #e2e8f0;padding:7px;text-align:left}.hide{display:none!important}
</style></head><body><div class="wrap"><div id="setup"><div class="title"><h1>복소수 좌표 게임</h1><p>참가자, 말 색, 턴 수를 정하세요.</p></div><div class="card"><h2>참가 인원수</h2><div id="counts" class="row"></div><h2>각자 몇 번씩?</h2><input id="rounds" class="name" type="number" value="4" min="1" max="10"><p><b>추천:</b> 1차 4~5턴이면 곱셈을 체감하기 좋아요.</p><h2>참가자 설정</h2><div id="settings"></div><button class="btn" style="width:100%;height:62px;font-size:22px" onclick="startGame()">게임 시작</button></div></div><div id="game" class="hide"><div class="grid"><div><div class="title row" style="justify-content:space-between"><div><b style="color:#bfdbfe">COMPLEX PLANE GAME</b><h1>복소수 좌표 게임</h1><p id="progress"></p></div><div class="row"><button id="m1" class="btn sec" onclick="switchMode('random')">1차: 멀리 가기</button><button id="m2" class="btn out" onclick="switchMode('target')">2차: 목표점</button></div></div><div class="boardbox"><div class="boardhead"><span>복소평면</span><span class="badge">범위 -20 ~ 20</span></div><div class="scroll"><svg id="board" width="560" height="560" viewBox="0 0 560 560"></svg></div></div></div><div><div class="card panel"><div id="turn" class="sec"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="sec" style="text-align:center"><b>현재 위치</b><div id="pos" style="font-size:26px;font-weight:1000"></div></div><div class="sec" style="text-align:center"><b>이번 연산</b><div id="op" style="font-size:44px;font-weight:1000">-</div></div></div><div id="msg" class="msg"></div><div id="result"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" class="sec"><div style="text-align:center;font-weight:900">실수부<div id="d1" class="dice">?</div></div><div style="text-align:center;font-weight:900">허수부<div id="d2" class="dice">?</div></div></div><div class="sec" style="text-align:center;border:2px solid #cbd5e1"><b>나온 복소수</b><div id="num" style="font-size:32px;font-weight:1000">-</div></div><div id="choose" class="sec hide"><b>연산 선택</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px"><button class="btn" onclick="selOp('+')">+</button><button class="btn out" onclick="selOp('-')">-</button><button class="btn out" onclick="selOp('×')">×</button></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button id="roll" class="btn" onclick="rollDice()">주사위</button><button id="skip" class="btn sec" onclick="skipTurn()">차례 넘기기</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><button class="btn out" onclick="resetPhase()">새 판</button><button class="btn out" onclick="backSetup()">설정</button></div></div><div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><h2>참가자 현황</h2><button id="targetBtn" class="btn out hide" onclick="newTarget()">목표 변경</button></div><div id="help"></div><div id="plist" class="players"></div></div><div class="card" style="margin-top:12px"><h2>계산 기록지</h2><div style="max-height:230px;overflow:auto"><table><thead><tr><th>턴</th><th>참가자</th><th>계산</th><th>선택</th><th>판정</th></tr></thead><tbody id="hist"><tr><td colspan="5">아직 기록이 없습니다.</td></tr></tbody></table></div></div></div></div></div></div><script>
const VAL=[-2,-1,0,1,2,3],OPS=['+','-','×'],L=20,S=14,SZ=560,C=280,CS=[['파랑','#2563eb','#dbeafe'],['빨강','#dc2626','#fee2e2'],['초록','#16a34a','#dcfce7'],['보라','#9333ea','#f3e8ff'],['주황','#ea580c','#ffedd5'],['분홍','#db2777','#fce7f3']].map(x=>({name:x[0],fill:x[1],light:x[2]}));
let pc=2,rounds=4,players=[{id:1,name:'1번',color:CS[0],pos:{re:0,im:0}},{id:2,name:'2번',color:CS[1],pos:{re:0,im:0}}],cur=0,mode='random',selected='+',randomOp='+',cand=null,turn=null,target={re:6,im:-4},hist=[],counts=[],bag=[...OPS],rolling=false,adv=false,over=false,phase={random:null,target:null},final=null,wrong=null;
const $=id=>document.getElementById(id), rd=()=>VAL[Math.floor(Math.random()*VAL.length)], x=a=>C+a*S, y=b=>C-b*S;
function fc(z){let a=z.re,b=z.im;if(a==0&&b==0)return'0';if(b==0)return''+a;if(a==0)return b==1?'i':b==-1?'-i':b+'i';let s=b>0?'+':'-',ab=Math.abs(b);return `${a} ${s} ${ab==1?'i':ab+'i'}`}
function op(z,w,o){return o=='+'?{re:z.re+w.re,im:z.im+w.im}:o=='-'?{re:z.re-w.re,im:z.im-w.im}:{re:z.re*w.re-z.im*w.im,im:z.re*w.im+z.im*w.re}}function dis(z,t={re:0,im:0}){return Math.hypot(z.re-t.re,z.im-t.im)}function ib(z){return Math.abs(z.re)<=L&&Math.abs(z.im)<=L}function same(a,b){return a.re==b.re&&a.im==b.im}function msg(t){$('msg').textContent=t}
function setup(){let c=$('counts');c.innerHTML='';[1,2,3,4,5].forEach(n=>{let b=document.createElement('button');b.className='btn '+(pc==n?'':'out');b.textContent=n+'명';b.onclick=()=>{pc=n;players=Array.from({length:n},(_,i)=>players[i]||{id:i+1,name:(i+1)+'번',color:CS[i],pos:{re:0,im:0}});settings();setup()};c.appendChild(b)});settings()}
function settings(){let box=$('settings');box.innerHTML='';players.forEach((p,i)=>{let d=document.createElement('div');d.className='setup-player';d.style.background=p.color.light;d.innerHTML=`<div class=row><span class=dot style="background:${p.color.fill}"></span><input class=name value="${p.name}"></div><div class=colors></div>`;d.querySelector('input').oninput=e=>p.name=e.target.value||((i+1)+'번');let co=d.querySelector('.colors');CS.forEach(c=>{let taken=players.some((q,j)=>j!=i&&q.color.name==c.name),b=document.createElement('button');b.className='color '+(p.color.name==c.name?'sel':'');b.disabled=taken;b.style.background=c.light;b.innerHTML=`<span class=dot style="background:${c.fill};display:block;margin:0 auto 4px"></span>${c.name}${taken?'<br><small>선택됨</small>':''}`;b.onclick=()=>{p.color=c;settings()};co.appendChild(b)});box.appendChild(d)})}
function startGame(){rounds=Math.max(1,+$('rounds').value||4);players=players.map(p=>({...p,pos:{re:0,im:0}}));cur=0;mode='random';hist=[];counts=players.map(()=>0);bag=[...OPS];cand=null;turn=null;over=false;final=null;phase={random:null,target:null};$('setup').classList.add('hide');$('game').classList.remove('hide');msg(players[0].name+' 차례입니다. 주사위를 굴리세요.');render()}
function backSetup(){$('game').classList.add('hide');$('setup').classList.remove('hide');setup()}function switchMode(m){if(cand||rolling||adv)return;mode=m;if(m=='target'){players=players.map(p=>({...p,pos:{re:0,im:0}}));cur=0;hist=[];counts=players.map(()=>0);cand=null;turn=null;over=false;msg(`2차 게임 시작! 모든 말을 원점으로 되돌렸습니다. ${players[0].name} 차례입니다. 주사위를 굴리세요.`)}render()}function selOp(o){if(!cand){selected=o;render()}}
function drawOp(){let b=bag.length?bag:[...OPS],i=Math.floor(Math.random()*b.length),o=b[i];bag=b.filter((_,j)=>j!=i);return o}function rollDice(){if(rolling||cand||adv||over)return;rolling=true;wrong=null;render();let t=0,tm=setInterval(()=>{$('d1').textContent=rd();$('d2').textContent=rd();$('d1').classList.add('roll');$('d2').classList.add('roll');if(++t>=10){clearInterval(tm);let n={re:rd(),im:rd()},ro=drawOp(),fo=mode=='random'?ro:selected;cand=n;randomOp=ro;turn={idx:cur,name:players[cur].name,color:players[cur].color.fill,before:{...players[cur].pos},number:n,op:fo};rolling=false;msg(`${turn.name}: ${fc(turn.before)} ${fo} (${fc(n)}) 를 계산하고 도착점을 찍으세요.`);render()}},65)}
function clickBoard(e){if(!turn){msg('먼저 주사위를 굴리세요.');return}let r=e.currentTarget.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*SZ,py=(e.clientY-r.top)/r.height*SZ,p={re:Math.round((px-C)/S),im:Math.round((C-py)/S)};if(!ib(p))return;let ans=op(turn.before,turn.number,turn.op);if(!ib(ans)){record(p,ans,false,'범위 밖');wrong=p;cand=null;turn=null;msg(`정답은 ${fc(ans)} 이지만 범위 밖입니다.`);complete(cur,players,900);return}if(same(p,ans)){record(p,ans,true,'정답');let i=turn.idx;players=players.map((q,j)=>j==i?{...q,pos:ans}:q);cand=null;turn=null;msg(`정답! ${players[i].name} 말이 (${ans.re}, ${ans.im})에 안착했습니다.`);render();complete(i,players,900)}else{wrong=p;msg(`삑! (${p.re}, ${p.im}) 은/는 정답 위치가 아닙니다.`);render();setTimeout(()=>{wrong=null;board()},850)}}
function record(p,a,ok,reason){hist.unshift({turn:hist.length+1,name:turn.name,color:turn.color,before:turn.before,number:turn.number,op:turn.op,picked:p,after:ok?a:turn.before,ok,reason})}function complete(i,fp,d){counts=counts.map((c,j)=>j==i?c+1:c);next(i,d,fp)}function next(i,d,fp=players){adv=true;render();setTimeout(()=>{if(counts.every(c=>c>=rounds)){finish(fp);return}let n=(i+1)%players.length,g=0;while(counts[n]>=rounds&&g<players.length){n=(n+1)%players.length;g++}cur=n;cand=null;turn=null;adv=false;wrong=null;msg(players[cur].name+' 차례입니다. 주사위를 굴리세요.');render()},d)}function skipTurn(){if(!rolling&&!cand&&!adv&&!over)next(cur,0)}function resetPhase(){players=players.map(p=>({...p,pos:{re:0,im:0}}));cur=0;cand=null;turn=null;hist=[];counts=players.map(()=>0);over=false;wrong=null;bag=[...OPS];msg('새 판입니다. '+players[0].name+' 차례입니다.');render()}function newTarget(){target={re:rd()*3,im:rd()*3};render()}
function ranks(fp,m){return fp.map(p=>({id:p.id,name:p.name,color:p.color,pos:p.pos,d:m=='target'?dis(p.pos,target):dis(p.pos)})).sort((a,b)=>m=='target'?a.d-b.d:b.d-a.d).map((p,i)=>({...p,point:fp.length-i}))}function finish(fp){let r=ranks(fp,mode),w=r[0];phase[mode]=r;over=true;adv=false;cand=null;turn=null;if(mode=='target'){let rows=players.map(p=>{let a=(phase.random||[]).find(x=>x.id==p.id),b=(phase.target||[]).find(x=>x.id==p.id),p1=a?.point||0,p2=b?.point||0;return{id:p.id,name:p.name,color:p.color,p1,p2,total:p1+p2*2}}).sort((a,b)=>b.total-a.total||b.p2-a.p2);final={rows,winner:rows[0]};msg('2차 게임 종료! 2차 승자는 '+w.name+' 입니다.')}else msg('1차 게임 종료! 1차 승자는 '+w.name+' 입니다. 2차 게임으로 넘어가세요.');render()}
function render(){$('progress').textContent=`각자 ${rounds}턴 · 완료 ${counts.reduce((a,b)=>a+b,0)} / ${players.length*rounds}`;$('m1').className='btn '+(mode=='random'?'sec':'out');$('m2').className='btn '+(mode=='target'?'sec':'out');$('targetBtn').classList.toggle('hide',mode!='target');$('choose').classList.toggle('hide',mode!='target');let p=players[cur];$('turn').style.background=p.color.light;$('turn').innerHTML=`<b>현재 차례</b><div style="font-size:32px;font-weight:1000"><span class=dot style="background:${p.color.fill}"></span>${p.name}</div><div style="font-size:19px;font-weight:900">현재 위치: (${p.pos.re}, ${p.pos.im})</div>`;$('pos').textContent=`(${p.pos.re}, ${p.pos.im})`;$('op').textContent=cand?(turn?.op||randomOp):'-';$('num').textContent=cand?fc(cand):'-';$('roll').disabled=rolling||cand||adv||over;$('skip').disabled=rolling||cand||adv||over;$('roll').textContent=adv?'차례 전환':rolling?'굴리는 중':'주사위';$('d1').textContent=cand?cand.re:'?';$('d2').textContent=cand?cand.im:'?';$('help').innerHTML=mode=='random'?'<div class=sec style="background:#fffbeb;font-weight:900">1차 게임: 원점에서 멀수록 유리합니다.</div>':`<div class=sec style="background:#fff1f2;font-weight:900">2차 게임: 목표점 ${fc(target)}에 가까울수록 유리합니다.</div>`;result();plist();history();board()}
function result(){let box=$('result');box.innerHTML='';if(!over)return;let r=ranks(players,mode),w=r[0];let h=`<div class=result><div>${mode=='random'?'1차 결과':'2차 결과'}</div><div style="font-size:32px;color:${w.color.fill}">승자: ${w.name}</div><div>${mode=='random'?`원점에서 거리 ${w.d.toFixed(2)}`:`목표점까지 거리 ${w.d.toFixed(2)}`}</div>`;if(mode=='target'&&final){h+='<details><summary>최종 승리자 확인하기</summary><div style="font-size:30px;text-align:center;font-weight:1000;color:'+final.winner.color.fill+'">'+final.winner.name+'</div>';final.rows.forEach(row=>h+=`<div class=prow><span><span class=dot style="background:${row.color.fill}"></span>${row.name}</span><span>${row.p1} + ${row.p2}×2 = ${row.total}</span></div>`);h+='</details>'}box.innerHTML=h+'</div>'}
function plist(){$('plist').innerHTML=players.map((p,i)=>`<div class="prow ${i==cur?'cur':''}" style="background:${p.color.light}"><span><span class=dot style="background:${p.color.fill}"></span>${p.name} · (${p.pos.re}, ${p.pos.im}) · ${counts[i]||0}/${rounds}턴</span><b>${(mode=='target'?dis(p.pos,target):dis(p.pos)).toFixed(2)}</b></div>`).join('')}
function history(){if(!hist.length){$('hist').innerHTML='<tr><td colspan=5>아직 기록이 없습니다.</td></tr>';return}$('hist').innerHTML=hist.map(h=>`<tr><td>${h.turn}</td><td><span class=dot style="width:12px;height:12px;background:${h.color}"></span>${h.name}</td><td>${fc(h.before)} ${h.op} (${fc(h.number)})</td><td>(${h.picked.re}, ${h.picked.im})</td><td style="font-weight:900;color:${h.ok?'#15803d':'#b91c1c'}">${h.ok?'정답':h.reason}</td></tr>`).join('')}
function board(){let s=$('board');s.innerHTML='';const NS='http://www.w3.org/2000/svg';function e(n,a){let v=document.createElementNS(NS,n);Object.entries(a).forEach(([k,val])=>v.setAttribute(k,val));s.appendChild(v);return v}for(let i=-L;i<=L;i++){let st=i==0||i%5==0;e('line',{x1:x(i),y1:0,x2:x(i),y2:SZ,stroke:i==0?'#0f172a':st?'#cbd5e1':'#f1f5f9','stroke-width':i==0?2.4:st?1:.55});e('line',{x1:0,y1:y(i),x2:SZ,y2:y(i),stroke:i==0?'#0f172a':st?'#cbd5e1':'#f1f5f9','stroke-width':i==0?2.4:st?1:.55})}for(let i=-20;i<=20;i+=5)if(i){e('text',{x:x(i)-6,y:C+18,fill:'#64748b','font-size':11,'font-weight':800}).textContent=i;e('text',{x:C+7,y:y(i)+4,fill:'#64748b','font-size':11,'font-weight':800}).textContent=i}e('text',{x:SZ-32,y:C-10,fill:'#334155','font-size':14,'font-weight':900}).textContent='Re';e('text',{x:C+10,y:20,fill:'#334155','font-size':14,'font-weight':900}).textContent='Im';hist.slice().reverse().forEach(h=>e('circle',{cx:x(h.after.re),cy:y(h.after.im),r:4,fill:h.color,opacity:.32}));if(mode=='target'){e('circle',{cx:x(target.re),cy:y(target.im),r:20,fill:'#f43f5e',opacity:.16});e('circle',{cx:x(target.re),cy:y(target.im),r:10,fill:'#f43f5e'});e('text',{x:x(target.re)+14,y:y(target.im)-14,fill:'#be123c','font-size':12,'font-weight':900}).textContent='목표 '+fc(target)}if(wrong){e('circle',{cx:x(wrong.re),cy:y(wrong.im),r:15,fill:'#ef4444',opacity:.25});e('line',{x1:x(wrong.re)-10,y1:y(wrong.im)-10,x2:x(wrong.re)+10,y2:y(wrong.im)+10,stroke:'#dc2626','stroke-width':4});e('line',{x1:x(wrong.re)+10,y1:y(wrong.im)-10,x2:x(wrong.re)-10,y2:y(wrong.im)+10,stroke:'#dc2626','stroke-width':4})}players.forEach((p,i)=>{let off=players.length>1?(i-(players.length-1)/2)*5:0,xx=x(p.pos.re)+off,yy=y(p.pos.im)+off,cu=i==cur;e('circle',{cx:xx,cy:yy,r:cu?24:18,fill:p.color.fill,opacity:.12});e('circle',{cx:xx,cy:yy,r:cu?13:10,fill:p.color.fill,stroke:cu?'#0f172a':'white','stroke-width':cu?4:2});e('text',{x:xx+15,y:yy+5,fill:p.color.fill,'font-size':12,'font-weight':900}).textContent=p.name})}
$('board').addEventListener('pointerdown',clickBoard);setup();
</script></body></html>
