<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>복소수 좌표 게임</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef2ff,#dbeafe);color:#0f172a}
button,input{font:inherit}
.wrap{max-width:1260px;margin:0 auto;padding:14px}
.hidden{display:none!important}
.card{background:white;border:3px solid #0f172a;border-radius:28px;box-shadow:0 10px 26px rgba(15,23,42,.14);padding:16px}
.hero{background:#0f172a;color:white;border-radius:28px;padding:20px;margin-bottom:14px;box-shadow:0 10px 26px rgba(15,23,42,.14)}
.hero h1{margin:0;font-size:34px;font-weight:1000}
.hero p{margin:6px 0 0;color:#dbeafe;font-weight:800}
.btn{border:0;border-radius:18px;background:#0f172a;color:white;font-weight:1000;padding:13px 16px;cursor:pointer;transition:transform .08s,opacity .1s}
.btn:active{transform:scale(.97)}
.btn.out{background:white;color:#0f172a;border:2px solid #cbd5e1}
.btn.sec{background:#e2e8f0;color:#0f172a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.game{grid-template-columns:minmax(580px,1fr) 420px}
@media(max-width:1000px){.game{grid-template-columns:1fr}}
.name{width:100%;border:2px solid #cbd5e1;border-radius:18px;padding:12px;font-size:20px;font-weight:1000;outline:none}
.name:focus{border-color:#0f172a}
.setupBlock{border:2px solid #cbd5e1;border-radius:24px;padding:14px;margin:10px 0}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.colorBtn{border:4px solid white;border-radius:18px;padding:10px;font-weight:1000;cursor:pointer}
.colorBtn.sel{border-color:#0f172a;transform:scale(1.04)}
.colorBtn:disabled{opacity:.35;cursor:not-allowed}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:8px}
.boardBox{background:white;border:4px solid #0f172a;border-radius:30px;padding:12px;box-shadow:0 12px 28px rgba(15,23,42,.16)}
.boardHead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:1000;font-size:20px;margin:0 8px 8px}
.badge{background:#0f172a;color:white;border-radius:999px;padding:7px 14px;font-size:15px}
.zoomBtns{display:flex;gap:8px}
.zoomBtns .btn{font-size:22px;padding:8px 15px}
.scroll{overflow:auto;background:#f8fafc;border-radius:24px;padding:8px;max-height:72vh}
svg{display:block;margin:auto;background:white;border-radius:18px;touch-action:none;user-select:none}
.panel .box{background:#f8fafc;border-radius:24px;padding:14px;margin-bottom:12px}
.msg{background:#0f172a;color:white;border-radius:22px;padding:14px;font-weight:1000;line-height:1.45;margin-bottom:12px;font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dice{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#f8fafc;border-radius:24px;padding:14px;margin-bottom:12px}
.die{height:96px;width:96px;margin:6px auto 0;border:4px solid #cbd5e1;border-radius:24px;display:grid;place-items:center;background:white;font-size:40px;font-weight:1000;box-shadow:0 6px 12px rgba(15,23,42,.12)}
.rollAnim{animation:shake .65s ease}
@keyframes shake{0%{transform:rotate(0) translateY(0)}20%{transform:rotate(16deg) translateY(-8px)}40%{transform:rotate(-16deg) translateY(5px)}60%{transform:rotate(10deg) translateY(-4px)}100%{transform:rotate(0) translateY(0)}}
.players{display:grid;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;border-radius:18px;padding:10px;font-weight:1000}
.prow.cur{outline:4px solid #0f172a}
.result{background:#fef3c7;border:4px solid #facc15;border-radius:24px;text-align:center;font-weight:1000;padding:15px;margin-bottom:12px}
summary{cursor:pointer;font-size:19px;font-weight:1000;text-align:center}
details{background:white;border-radius:18px;padding:12px;margin-top:10px;text-align:left}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}
.small{font-size:13px;color:#475569;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
<section id="setup">
  <div class="hero">
    <h1>복소수 좌표 게임</h1>
    <p>참가자, 말 색, 턴 수를 정한 뒤 시작하세요.</p>
  </div>
  <div class="card">
    <h2>참가 인원수</h2>
    <div id="countBtns" class="row"></div>

    <h2>각자 몇 번씩 할까요?</h2>
    <input id="rounds" class="name" type="number" min="1" max="10" value="4">
    <p class="small">추천: 1차는 4~5턴이면 곱셈을 충분히 체감하기 좋습니다.</p>

    <h2>참가자 설정</h2>
    <div id="settings"></div>

    <button class="btn" style="width:100%;height:64px;font-size:23px;margin-top:12px" onclick="start()">게임 시작</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="grid game">
    <div>
      <div class="hero row" style="justify-content:space-between">
        <div>
          <div style="color:#bfdbfe;font-weight:1000;font-size:13px">COMPLEX PLANE GAME</div>
          <h1>복소수 좌표 게임</h1>
          <p id="progress"></p>
        </div>
        <div class="row">
          <button id="bRandom" class="btn sec" onclick="setModeGame('random')">1차: 멀리 가기</button>
          <button id="bTarget" class="btn out" onclick="setModeGame('target')">2차: 목표점</button>
        </div>
      </div>

      <div class="boardBox">
        <div class="boardHead">
          <div class="zoomBtns">
            <button class="btn out" onclick="zoomOut()">－</button>
            <button class="btn out" onclick="zoomIn()">＋</button>
          </div>
          <span>복소평면</span>
          <span id="zoomBadge" class="badge">범위 -20 ~ 20</span>
        </div>
        <div class="scroll">
          <svg id="board" width="800" height="800" viewBox="0 0 800 800"></svg>
        </div>
      </div>
    </div>

    <div>
      <div class="card panel">
        <div id="turn" class="box"></div>

        <div class="two">
          <div class="box" style="text-align:center">
            <b>현재 위치</b>
            <div id="pos" style="font-size:28px;font-weight:1000"></div>
          </div>
          <div class="box" style="text-align:center">
            <b>이번 연산</b>
            <div id="op" style="font-size:48px;font-weight:1000">-</div>
          </div>
        </div>

        <div id="msg" class="msg">주사위를 굴리세요.</div>
        <div id="result"></div>

        <div class="dice">
          <div style="text-align:center;font-weight:1000">실수부<div id="d1" class="die">?</div></div>
          <div style="text-align:center;font-weight:1000">허수부<div id="d2" class="die">?</div></div>
        </div>

        <div class="box" style="text-align:center;border:2px solid #cbd5e1">
          <b>나온 복소수</b>
          <div id="num" style="font-size:34px;font-weight:1000">-</div>
        </div>

        <div id="choose" class="box hidden">
          <b>연산 선택</b>
          <div class="row" style="display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px">
            <button id="opPlus" class="btn" onclick="setSelected('+')">+</button>
            <button id="opMinus" class="btn out" onclick="setSelected('-')">-</button>
            <button id="opMul" class="btn out" onclick="setSelected('×')">×</button>
          </div>
        </div>

        <div class="two">
          <button id="roll" class="btn" style="height:64px;font-size:22px" onclick="rollDice()">주사위</button>
          <button id="skip" class="btn sec" style="height:64px;font-size:22px" onclick="manualNext()">차례 넘기기</button>
        </div>
        <div class="two" style="margin-top:10px">
          <button class="btn out" onclick="resetPhase()">새 판</button>
          <button class="btn out" onclick="back()">설정</button>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="row" style="justify-content:space-between">
          <h2>참가자 현황</h2>
          <button id="targetBtn" class="btn out hidden" onclick="newTarget()">목표 변경</button>
        </div>
        <div id="help"></div>
        <div id="plist" class="players"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>계산 기록지</h2>
        <div style="max-height:250px;overflow:auto">
          <table>
            <thead><tr><th>턴</th><th>참가자</th><th>계산</th><th>선택</th><th>판정</th></tr></thead>
            <tbody id="hist"><tr><td colspan="5">아직 기록이 없습니다.</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
</div>

<script>
const DIE_VALUES=[-2,-1,0,1,2,3];
const OPS=["+","-","×"];
const RANDOM_OPS=["+","-","×","×"];
const LIMIT=20;
const COLORS=[
  {name:"파랑",fill:"#2563eb",light:"#dbeafe"},
  {name:"빨강",fill:"#dc2626",light:"#fee2e2"},
  {name:"초록",fill:"#16a34a",light:"#dcfce7"},
  {name:"보라",fill:"#9333ea",light:"#f3e8ff"},
  {name:"주황",fill:"#ea580c",light:"#ffedd5"},
  {name:"분홍",fill:"#db2777",light:"#fce7f3"}
];

let scale=20;
let size=LIMIT*2*scale;
let center=size/2;

let playerCount=2;
let rounds=4;
let players=[mkPlayer(1,0),mkPlayer(2,1)];
let current=0;
let mode="random";
let selected="+";
let opBag=[...RANDOM_OPS];
let candidate=null;
let pendingTurn=null;
let target={re:6,im:-4};
let history=[];
let turnCounts=[];
let phaseResults={random:null,target:null};
let finalResult=null;
let gameOver=false;
let rolling=false;
let advancing=false;
let wrongPoint=null;

function q(id){return document.getElementById(id)}
function mkPlayer(id,colorIdx){return{id,name:id+"번",color:COLORS[colorIdx],position:{re:0,im:0}}}
function rollDie(){return DIE_VALUES[Math.floor(Math.random()*DIE_VALUES.length)]}
function formatComplex(z){
  const a=z.re,b=z.im;
  if(a===0&&b===0)return"0";
  if(b===0)return""+a;
  if(a===0)return b===1?"i":b===-1?"-i":b+"i";
  const sign=b>0?"+":"-";
  const absB=Math.abs(b);
  return a+" "+sign+" "+(absB===1?"i":absB+"i");
}
function add(z,w){return{re:z.re+w.re,im:z.im+w.im}}
function sub(z,w){return{re:z.re-w.re,im:z.im-w.im}}
function mul(z,w){return{re:z.re*w.re-z.im*w.im,im:z.re*w.im+z.im*w.re}}
function operate(z,w,op){return op==="+"?add(z,w):op==="-"?sub(z,w):mul(z,w)}
function distance(z,t={re:0,im:0}){return Math.sqrt((z.re-t.re)**2+(z.im-t.im)**2)}
function inBounds(z){return Math.abs(z.re)<=LIMIT&&Math.abs(z.im)<=LIMIT}
function sx(x){return center+x*scale}
function sy(y){return center-y*scale}

function setup(){
  const cb=q("countBtns");
  cb.innerHTML="";
  [1,2,3,4,5].forEach(n=>{
    const b=document.createElement("button");
    b.className="btn "+(playerCount===n?"":"out");
    b.textContent=n+"명";
    b.onclick=()=>setCount(n);
    cb.appendChild(b);
  });
  renderSettings();
}
function setCount(n){
  playerCount=n;
  players=Array.from({length:n},(_,i)=>players[i]||mkPlayer(i+1,i));
  players=players.map((p,i)=>({...p,id:i+1,name:p.name||`${i+1}번`}));
  current=0;
  setup();
}
function renderSettings(){
  const box=q("settings");
  box.innerHTML="";
  players.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="setupBlock";
    div.style.background=p.color.light;
    div.innerHTML=
      '<div class="row"><span class="dot" style="background:'+p.color.fill+'"></span><input class="name" value="'+escapeHtml(p.name)+'" placeholder="'+(i+1)+'번 이름"></div><div class="colors"></div>';
    div.querySelector("input").oninput=e=>{
      players[i].name=e.target.value.trimStart()||`${i+1}번`;
    };
    const colors=div.querySelector(".colors");
    COLORS.forEach(c=>{
      const taken=players.some((pp,idx)=>idx!==i&&pp.color.name===c.name);
      const bt=document.createElement("button");
      bt.className="colorBtn "+(p.color.name===c.name?"sel":"");
      bt.disabled=taken;
      bt.style.background=c.light;
      bt.innerHTML='<span class="dot" style="background:'+c.fill+';display:block;margin:0 auto 4px"></span>'+c.name+(taken?'<br><small>선택됨</small>':'');
      bt.onclick=()=>{if(!taken){players[i].color=c;renderSettings()}};
      colors.appendChild(bt);
    });
    box.appendChild(div);
  });
}
function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}

function start(){
  rounds=Math.max(1,Number(q("rounds").value)||4);
  players=players.map(p=>({...p,position:{re:0,im:0}}));
  current=0;
  mode="random";
  selected="+";
  opBag=[...RANDOM_OPS];
  candidate=null;
  pendingTurn=null;
  target={re:6,im:-4};
  history=[];
  turnCounts=players.map(()=>0);
  phaseResults={random:null,target:null};
  finalResult=null;
  gameOver=false;
  rolling=false;
  advancing=false;
  wrongPoint=null;
  q("setup").classList.add("hidden");
  q("game").classList.remove("hidden");
  setMsg(`${players[0].name} 차례입니다. 주사위를 굴리세요.`);
  renderAll();
}
function back(){
  q("game").classList.add("hidden");
  q("setup").classList.remove("hidden");
  setup();
}

function setModeGame(nextMode){
  if(candidate||rolling||advancing)return;
  mode=nextMode;
  if(mode==="target"){
    players=players.map(p=>({...p,position:{re:0,im:0}}));
    current=0;
    candidate=null;
    pendingTurn=null;
    history=[];
    turnCounts=players.map(()=>0);
    wrongPoint=null;
    gameOver=false;
    finalResult=null;
    setMsg(`2차 게임 시작! 모든 말을 원점으로 되돌렸습니다. ${players[0].name} 차례입니다. 주사위를 굴리세요.`);
  }
  renderAll();
}
function setSelected(op){
  if(candidate)return;
  selected=op;
  renderAll();
}
function drawOperation(){
  const isFirstTurnForCurrentPlayer=mode==="random"&&(turnCounts[current]||0)===0;
  if(isFirstTurnForCurrentPlayer){
    const firstOps=["+","-"];
    return firstOps[Math.floor(Math.random()*firstOps.length)];
  }
  const bag=opBag.length>0?opBag:[...RANDOM_OPS];
  const idx=Math.floor(Math.random()*bag.length);
  const picked=bag[idx];
  opBag=bag.filter((_,i)=>i!==idx);
  return picked;
}

function rollDice(){
  if(rolling||candidate||advancing||gameOver)return;
  rolling=true;
  wrongPoint=null;
  renderAll();
  let ticks=0;
  const timer=setInterval(()=>{
    const a=rollDie(),b=rollDie();
    q("d1").textContent=a;
    q("d2").textContent=b;
    q("d1").classList.add("rollAnim");
    q("d2").classList.add("rollAnim");
    setTimeout(()=>{q("d1").classList.remove("rollAnim");q("d2").classList.remove("rollAnim")},650);
    ticks++;
    if(ticks>=10){
      clearInterval(timer);
      const num={re:rollDie(),im:rollDie()};
      const rop=drawOperation();
      const fixedOp=mode==="random"?rop:selected;
      candidate=num;
      pendingTurn={
        playerIndex:current,
        playerName:players[current].name,
        playerColor:players[current].color.fill,
        before:{...players[current].position},
        number:num,
        op:fixedOp
      };
      rolling=false;
      setMsg(`${pendingTurn.playerName}: ${formatComplex(pendingTurn.before)} ${fixedOp} (${formatComplex(num)}) 를 계산하고 도착점을 찍으세요.`);
      renderAll();
    }
  },65);
}

function boardClick(e){
  if(!pendingTurn){
    setMsg("먼저 주사위를 굴리세요.");
    return;
  }
  const rect=e.currentTarget.getBoundingClientRect();
  const svgX=((e.clientX-rect.left)/rect.width)*size;
  const svgY=((e.clientY-rect.top)/rect.height)*size;
  const picked={re:Math.round((svgX-center)/scale),im:Math.round((center-svgY)/scale)};
  if(!inBounds(picked))return;

  const answer=operate(pendingTurn.before,pendingTurn.number,pendingTurn.op);

  if(!inBounds(answer)){
    recordAttempt(picked,answer,false,"범위 밖");
    const idx=pendingTurn.playerIndex;
    candidate=null;
    pendingTurn=null;
    wrongPoint=picked;
    setMsg(`정답은 ${formatComplex(answer)} 이지만 게임판 범위 밖입니다. 이번 턴은 이동하지 않습니다.`);
    completeTurn(idx,players,950);
    renderAll();
    return;
  }

  if(picked.re===answer.re&&picked.im===answer.im){
    recordAttempt(picked,answer,true,"정답");
    const idx=pendingTurn.playerIndex;
    players=players.map((p,i)=>i===idx?{...p,position:answer}:p);
    candidate=null;
    pendingTurn=null;
    setMsg(`정답! ${players[idx].name} 말이 (${answer.re}, ${answer.im})에 안착했습니다.`);
    renderAll();
    completeTurn(idx,players,900);
  }else{
    wrongPoint=picked;
    setMsg(`삑! (${picked.re}, ${picked.im}) 은/는 정답 위치가 아닙니다. 다시 계산해 보세요.`);
    renderAll();
    setTimeout(()=>{wrongPoint=null;drawBoard()},850);
  }
}
function recordAttempt(picked,answer,accepted,reason){
  if(!pendingTurn)return;
  history.unshift({
    turn:history.length+1,
    playerName:pendingTurn.playerName,
    playerColor:pendingTurn.playerColor,
    before:pendingTurn.before,
    number:pendingTurn.number,
    op:pendingTurn.op,
    picked,
    expected:answer,
    after:accepted?answer:pendingTurn.before,
    accepted,
    reason
  });
}
function completeTurn(idx,finalPlayers,delay){
  turnCounts=turnCounts.map((c,i)=>i===idx?c+1:c);
  moveNext(idx,delay,finalPlayers);
}
function moveNext(fromIndex,delay,finalPlayers=players){
  advancing=true;
  renderAll();
  setTimeout(()=>{
    if(turnCounts.every(c=>c>=rounds)){
      finishGame(finalPlayers);
      return;
    }
    let next=(fromIndex+1)%players.length;
    let guard=0;
    while(turnCounts[next]>=rounds&&guard<players.length){
      next=(next+1)%players.length;
      guard++;
    }
    current=next;
    candidate=null;
    pendingTurn=null;
    advancing=false;
    wrongPoint=null;
    setMsg(`${players[current].name} 차례입니다. 주사위를 굴리세요.`);
    renderAll();
  },delay);
}
function manualNext(){
  if(rolling||candidate||advancing||gameOver)return;
  moveNext(current,0,players);
}
function resetPhase(){
  players=players.map(p=>({...p,position:{re:0,im:0}}));
  current=0;
  candidate=null;
  pendingTurn=null;
  history=[];
  turnCounts=players.map(()=>0);
  wrongPoint=null;
  gameOver=false;
  opBag=[...RANDOM_OPS];
  setMsg(`새 판입니다. ${players[0].name} 차례입니다. 주사위를 굴리세요.`);
  renderAll();
}
function newTarget(){
  target={re:rollDie()*3,im:rollDie()*3};
  renderAll();
}
function zoomIn(){
  scale=Math.min(32,scale+2);
  updateGeometry();
  renderAll();
}
function zoomOut(){
  scale=Math.max(12,scale-2);
  updateGeometry();
  renderAll();
}
function updateGeometry(){
  size=LIMIT*2*scale;
  center=size/2;
  const svg=q("board");
  svg.setAttribute("width",size);
  svg.setAttribute("height",size);
  svg.setAttribute("viewBox",`0 0 ${size} ${size}`);
}
function rankings(finalPlayers,gameMode){
  return finalPlayers.map(p=>({
    id:p.id,
    name:p.name,
    color:p.color,
    position:p.position,
    distance:gameMode==="target"?distance(p.position,target):distance(p.position)
  }))
  .sort((a,b)=>gameMode==="target"?a.distance-b.distance:b.distance-a.distance)
  .map((p,i)=>({...p,rank:i+1,point:finalPlayers.length-i}));
}
function finishGame(finalPlayers){
  const r=rankings(finalPlayers,mode);
  const w=r[0];
  phaseResults[mode]=r;
  gameOver=true;
  advancing=false;
  candidate=null;
  pendingTurn=null;

  if(mode==="target"){
    const rows=players.map(p=>{
      const r1=(phaseResults.random||[]).find(x=>x.id===p.id);
      const r2=(phaseResults.target||[]).find(x=>x.id===p.id);
      const p1=r1?.point||0;
      const p2=r2?.point||0;
      return{id:p.id,name:p.name,color:p.color,randomPoint:p1,targetPoint:p2,totalPoint:p1+p2*2};
    }).sort((a,b)=>b.totalPoint-a.totalPoint||b.targetPoint-a.targetPoint||b.randomPoint-a.randomPoint);
    finalResult={rows,winner:rows[0]};
    setMsg(`2차 게임 종료! 2차 승자는 ${w.name} 입니다.`);
  }else{
    setMsg(`1차 게임 종료! 1차 승자는 ${w.name} 입니다. 2차 게임으로 넘어가세요.`);
  }
  renderAll();
}
function setMsg(text){q("msg").textContent=text}

function renderAll(){
  const p=players[current];
  q("progress").textContent=`각자 ${rounds}턴 · 완료 ${turnCounts.reduce((a,b)=>a+b,0)} / ${players.length*rounds}`;
  q("bRandom").className="btn "+(mode==="random"?"sec":"out");
  q("bTarget").className="btn "+(mode==="target"?"sec":"out");
  q("choose").classList.toggle("hidden",mode!=="target");
  q("targetBtn").classList.toggle("hidden",mode!=="target");
  q("zoomBadge").textContent=`범위 -20 ~ 20 · 확대 ${scale}`;

  q("turn").style.background=p.color.light;
  q("turn").innerHTML=`<b>현재 차례</b><div style="font-size:34px;font-weight:1000"><span class="dot" style="background:${p.color.fill}"></span>${escapeHtml(p.name)}</div><div style="font-size:20px;font-weight:1000">현재 위치: (${p.position.re}, ${p.position.im})</div>`;
  q("pos").textContent=`(${p.position.re}, ${p.position.im})`;
  q("op").textContent=candidate?pendingTurn.op:"-";
  q("num").textContent=candidate?formatComplex(candidate):"-";
  q("d1").textContent=candidate?candidate.re:"?";
  q("d2").textContent=candidate?candidate.im:"?";
  q("roll").disabled=rolling||candidate||advancing||gameOver;
  q("skip").disabled=rolling||candidate||advancing||gameOver;
  q("roll").textContent=advancing?"차례 전환":rolling?"굴리는 중":"주사위";

  q("opPlus").className="btn "+(selected==="+"?"":"out");
  q("opMinus").className="btn "+(selected==="-"?"":"out");
  q("opMul").className="btn "+(selected==="×"?"":"out");

  q("help").innerHTML=mode==="random"
    ? '<div class="box" style="background:#fffbeb;font-weight:1000">1차 게임: 원점에서 멀수록 유리합니다. 각 참가자의 첫 턴에는 곱셈이 나오지 않습니다.</div>'
    : `<div class="box" style="background:#fff1f2;font-weight:1000">2차 게임: 목표점 ${formatComplex(target)}에 가까울수록 유리합니다.</div>`;

  renderResult();
  renderPlayers();
  renderHistory();
  drawBoard();
}
function renderResult(){
  const box=q("result");
  box.innerHTML="";
  if(!gameOver)return;
  const r=rankings(players,mode);
  const w=r[0];
  let html=`<div class="result"><div>${mode==="random"?"1차 결과":"2차 결과"}</div><div style="font-size:34px;color:${w.color.fill}">승자: ${escapeHtml(w.name)}</div><div>${mode==="random"?"원점에서 거리 ":"목표점까지 거리 "}${w.distance.toFixed(2)}</div>`;
  if(mode==="target"&&finalResult){
    html+=`<details><summary>최종 승리자 확인하기</summary><div style="font-size:34px;text-align:center;font-weight:1000;color:${finalResult.winner.color.fill};margin:10px 0">${escapeHtml(finalResult.winner.name)}</div>`;
    finalResult.rows.forEach(row=>{
      html+=`<div class="prow"><span><span class="dot" style="background:${row.color.fill}"></span>${escapeHtml(row.name)}</span><span>${row.randomPoint} + ${row.targetPoint}×2 = ${row.totalPoint}</span></div>`;
    });
    html+="</details>";
  }
  html+="</div>";
  box.innerHTML=html;
}
function renderPlayers(){
  q("plist").innerHTML=players.map((p,i)=>{
    const d=mode==="target"?distance(p.position,target):distance(p.position);
    return `<div class="prow ${i===current?"cur":""}" style="background:${p.color.light}"><span><span class="dot" style="background:${p.color.fill}"></span>${escapeHtml(p.name)} · (${p.position.re}, ${p.position.im}) · ${turnCounts[i]||0}/${rounds}턴</span><b>${d.toFixed(2)}</b></div>`;
  }).join("");
}
function renderHistory(){
  if(!history.length){
    q("hist").innerHTML='<tr><td colspan="5">아직 기록이 없습니다.</td></tr>';
    return;
  }
  q("hist").innerHTML=history.map(h=>`<tr><td>${h.turn}</td><td><span class="dot" style="width:12px;height:12px;background:${h.playerColor}"></span>${escapeHtml(h.playerName)}</td><td>${formatComplex(h.before)} ${h.op} (${formatComplex(h.number)})</td><td>(${h.picked.re}, ${h.picked.im})</td><td style="font-weight:1000;color:${h.accepted?"#15803d":"#b91c1c"}">${h.accepted?"정답":h.reason}</td></tr>`).join("");
}
function drawBoard(){
  const svg=q("board");
  svg.innerHTML="";
  updateGeometry();
  const ns="http://www.w3.org/2000/svg";
  function el(name,attrs,text){
    const e=document.createElementNS(ns,name);
    Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
    if(text!==undefined)e.textContent=text;
    svg.appendChild(e);
    return e;
  }

  el("rect",{x:0,y:0,width:size,height:size,fill:"#fff"});
  for(let i=-LIMIT;i<=LIMIT;i++){
    const strong=i===0||i%5===0;
    el("line",{x1:sx(i),y1:0,x2:sx(i),y2:size,stroke:i===0?"#0f172a":strong?"#cbd5e1":"#f1f5f9","stroke-width":i===0?4:strong?1.8:.8});
    el("line",{x1:0,y1:sy(i),x2:size,y2:sy(i),stroke:i===0?"#0f172a":strong?"#cbd5e1":"#f1f5f9","stroke-width":i===0?4:strong?1.8:.8});
  }
  for(let i=-20;i<=20;i+=5){
    if(i!==0){
      el("text",{x:sx(i)-8,y:center+22,fill:"#334155","font-size":16,"font-weight":900},i);
      el("text",{x:center+9,y:sy(i)+5,fill:"#334155","font-size":16,"font-weight":900},i);
    }
  }
  el("text",{x:size-38,y:center-12,fill:"#334155","font-size":16,"font-weight":900},"Re");
  el("text",{x:center+12,y:24,fill:"#334155","font-size":16,"font-weight":900},"Im");

  history.slice().reverse().forEach(h=>{
    el("circle",{cx:sx(h.after.re),cy:sy(h.after.im),r:4,fill:h.playerColor,opacity:.32});
  });

  if(mode==="target"){
    el("circle",{cx:sx(target.re),cy:sy(target.im),r:22,fill:"#f43f5e",opacity:.16});
    el("circle",{cx:sx(target.re),cy:sy(target.im),r:10,fill:"#f43f5e"});
    el("text",{x:sx(target.re)+14,y:sy(target.im)-14,fill:"#be123c","font-size":14,"font-weight":900},`목표 ${formatComplex(target)}`);
  }

  if(wrongPoint){
    el("circle",{cx:sx(wrongPoint.re),cy:sy(wrongPoint.im),r:15,fill:"#ef4444",opacity:.25});
    el("line",{x1:sx(wrongPoint.re)-10,y1:sy(wrongPoint.im)-10,x2:sx(wrongPoint.re)+10,y2:sy(wrongPoint.im)+10,stroke:"#dc2626","stroke-width":4});
    el("line",{x1:sx(wrongPoint.re)+10,y1:sy(wrongPoint.im)-10,x2:sx(wrongPoint.re)-10,y2:sy(wrongPoint.im)+10,stroke:"#dc2626","stroke-width":4});
  }

  players.forEach((p,i)=>{
    const offset=players.length>1?(i-(players.length-1)/2)*5:0;
    const x=sx(p.position.re)+offset;
    const y=sy(p.position.im)+offset;
    const isCurrent=i===current;
    el("circle",{cx:x,cy:y,r:isCurrent?24:18,fill:p.color.fill,opacity:.12});
    el("circle",{cx:x,cy:y,r:isCurrent?13:10,fill:p.color.fill,stroke:isCurrent?"#0f172a":"white","stroke-width":isCurrent?4:2});
    el("text",{x:x+15,y:y+5,fill:p.color.fill,"font-size":12,"font-weight":900},p.name);
  });
}

q("board").addEventListener("pointerdown",boardClick);
setup();
</script>
</body>
</html>
